name: Brevo API Health Check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:        # allows manual run

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run health check
        run: python .github/scripts/health_check.py
        env:
          SENDINBLUE_API_KEY_PROD: ${{ secrets.SENDINBLUE_API_KEY_PROD }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

      - name: Commit monitoring state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/monitoring/brevo_state.json
          git commit -m "Update Brevo API monitoring state" || echo "No changes"
          git push
